<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公众号文章排版工具 | AI-Writer</title>
  <meta name="description" content="粘贴文章内容，选择排版样式，实时预览并复制到公众号编辑器。内容在本地浏览器处理。">
  <meta name="theme-color" content="#fffaf2" />
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
  <link rel="stylesheet" href="/themes.css?v=27" />
  <link rel="stylesheet" href="/formatter.css?v=1" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
  <script src="/formatter.js?v=1" defer></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="/" aria-label="AI-Writer 排版工具首页">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span>
          <span class="brand-title">公众号文章排版</span>
          <span class="brand-subtitle">粘贴内容 · 选择样式 · 复制使用</span>
        </span>
      </a>
      <span class="privacy-note"><span class="privacy-dot"></span>无需登录，内容仅在本地处理</span>
    </header>

    <main>
      <section class="toolbar" aria-label="排版设置">
        <label class="control">
          <span>主题</span>
          <select id="theme-select">
            <option value="default">蓝色清新</option>
            <option value="grace">优雅渐变</option>
            <option value="simple">黑白极简</option>
            <option value="green">清新绿</option>
          </select>
        </label>
        <label class="control">
          <span>字体</span>
          <select id="font-select">
            <option value='-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif'>系统默认</option>
            <option value='"PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif'>黑体</option>
            <option value='Georgia, "Times New Roman", "STSong", "SimSun", serif'>衬线</option>
          </select>
        </label>
        <label class="control">
          <span>字号</span>
          <select id="fontsize-select">
            <option value="14px">14 px</option>
            <option value="15px" selected>15 px</option>
            <option value="16px">16 px</option>
            <option value="17px">17 px</option>
            <option value="18px">18 px</option>
          </select>
        </label>
        <span class="toolbar-spacer"></span>
        <button id="btn-clear" class="button button-quiet" type="button">清空</button>
        <button id="btn-copy" class="button button-primary" type="button">复制富文本</button>
      </section>

      <div class="workspace">
        <section class="panel input-panel" aria-labelledby="input-title">
          <div class="panel-heading">
            <div>
              <h1 id="input-title">粘贴文章</h1>
              <p>可直接粘贴富文本，也可粘贴普通文本或 Markdown。</p>
            </div>
            <span class="panel-index">01</span>
          </div>
          <div class="editor-toolbar" role="toolbar" aria-label="文字格式">
            <button type="button" class="format-button" data-command="bold" title="加粗（Ctrl+B）"><strong>B</strong></button>
            <button type="button" class="format-button" data-command="italic" title="斜体（Ctrl+I）"><em>I</em></button>
            <button type="button" class="format-button" data-command="underline" title="下划线（Ctrl+U）"><u>U</u></button>
            <span class="format-divider"></span>
            <select id="block-format" aria-label="段落样式" title="段落样式">
              <option value="p">正文</option>
              <option value="h1">标题</option>
              <option value="h2">二级标题</option>
              <option value="h3">三级标题</option>
              <option value="blockquote">引用</option>
            </select>
            <button type="button" class="format-button" data-command="insertUnorderedList" title="项目符号列表">• 列表</button>
            <button type="button" class="format-button" data-command="insertOrderedList" title="编号列表">1. 列表</button>
            <button type="button" id="btn-link" class="format-button" title="插入链接">链接</button>
            <span class="format-divider"></span>
            <button type="button" class="format-button" data-command="justifyLeft" title="左对齐">左</button>
            <button type="button" class="format-button" data-command="justifyCenter" title="居中">中</button>
            <button type="button" class="format-button" data-command="justifyRight" title="右对齐">右</button>
            <button type="button" class="format-button format-clear" data-command="removeFormat" title="清除选中文字格式">清格式</button>
          </div>
          <div id="source-text" class="rich-editor" contenteditable="true" role="textbox" aria-label="文章内容" aria-multiline="true" data-placeholder="在这里粘贴或输入文章内容。&#10;&#10;可以保留从其他编辑器复制来的富文本格式，也可以使用上方工具栏编辑。"></div>
          <div class="input-footer">
            <span id="word-count">0 字</span>
            <span>快捷键：Ctrl/⌘ + Enter 复制排版</span>
          </div>
        </section>

        <section class="panel preview-panel" aria-labelledby="preview-title">
          <div class="panel-heading preview-heading">
            <div>
              <h2 id="preview-title">排版预览</h2>
              <p>复制后可直接粘贴到公众号编辑器。</p>
            </div>
            <span class="live-indicator"><span></span>实时预览</span>
          </div>
          <div class="preview-stage">
            <article id="preview-content" class="preview-wrap wx-preview theme-default" aria-live="polite">
              <p class="preview-placeholder">文章预览会显示在这里</p>
            </article>
          </div>
        </section>
      </div>

      <footer class="footer">
        <span>粘贴或编辑富文本 → 调整样式 → 复制富文本 → 粘贴到公众号</span>
        <span>AI-Writer 排版工具</span>
      </footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
