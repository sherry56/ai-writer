<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公众号文章排版工具 | AI-Writer</title>
  <meta name="description" content="粘贴文章内容，选择排版样式，实时预览并复制到公众号编辑器。内容在本地浏览器处理。">
  <meta name="theme-color" content="#fffaf2" />
  <link rel="icon" href="/static/favicon.svg?v=1" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/themes.css?v=26" />
  <link rel="stylesheet" href="/formatter.css?v=1" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
  <script src="/formatter.js?v=1" defer></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="/" aria-label="AI-Writer 排版工具首页">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span>
          <span class="brand-title">公众号文章排版</span>
          <span class="brand-subtitle">粘贴内容 · 选择样式 · 复制使用</span>
        </span>
      </a>
      <span class="privacy-note"><span class="privacy-dot"></span>无需登录，内容仅在本地处理</span>
    </header>

    <main>
      <section class="toolbar" aria-label="排版设置">
        <label class="control">
          <span>主题</span>
          <select id="theme-select">
            <option value="default">蓝色清新</option>
            <option value="grace">优雅渐变</option>
            <option value="simple">黑白极简</option>
            <option value="green">清新绿</option>
          </select>
        </label>
        <label class="control">
          <span>字体</span>
          <select id="font-select">
            <option value='-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif'>系统默认</option>
            <option value='"PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif'>黑体</option>
            <option value='Georgia, "Times New Roman", "STSong", "SimSun", serif'>衬线</option>
          </select>
        </label>
        <label class="control">
          <span>字号</span>
          <select id="fontsize-select">
            <option value="14px">14 px</option>
            <option value="15px" selected>15 px</option>
            <option value="16px">16 px</option>
            <option value="17px">17 px</option>
            <option value="18px">18 px</option>
          </select>
        </label>
        <span class="toolbar-spacer"></span>
        <button id="btn-clear" class="button button-quiet" type="button">清空</button>
        <button id="btn-copy" class="button button-primary" type="button">复制排版内容</button>
      </section>

      <div class="workspace">
        <section class="panel input-panel" aria-labelledby="input-title">
          <div class="panel-heading">
            <div>
              <h1 id="input-title">粘贴文章</h1>
              <p>支持普通文本和 Markdown，预览会随输入即时更新。</p>
            </div>
            <span class="panel-index">01</span>
          </div>
          <textarea id="source-text" spellcheck="false" placeholder="# 在这里粘贴文章标题

粘贴正文后，右侧会即时生成排版预览。

## 小标题

空一行即可分段；也支持 **加粗**、列表、引用和链接。"></textarea>
          <div class="input-footer">
            <span id="word-count">0 字</span>
            <span>快捷键：Ctrl/⌘ + Enter 复制</span>
          </div>
        </section>

        <section class="panel preview-panel" aria-labelledby="preview-title">
          <div class="panel-heading preview-heading">
            <div>
              <h2 id="preview-title">排版预览</h2>
              <p>复制后可直接粘贴到公众号编辑器。</p>
            </div>
            <span class="live-indicator"><span></span>实时预览</span>
          </div>
          <div class="preview-stage">
            <article id="preview-content" class="preview-wrap wx-preview theme-default" aria-live="polite">
              <p class="preview-placeholder">文章预览会显示在这里</p>
            </article>
          </div>
        </section>
      </div>

      <footer class="footer">
        <span>粘贴内容 → 调整主题和字号 → 复制排版内容 → 粘贴到公众号</span>
        <span>AI-Writer 排版工具</span>
      </footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
