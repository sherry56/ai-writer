<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · AI-Writer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css?v=27" />
</head>
<body class="bg-orange-50 text-stone-800 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-lg border border-amber-200 p-6">
    <h1 class="text-2xl font-semibold text-amber-800 mb-1">AI-Writer</h1>
    <p class="text-xs text-stone-500 mb-6">公众号 AI 写作 · 请先登录</p>

    <form id="login-form" class="space-y-4">
      <label class="block">
        <span class="text-sm text-stone-700">用户名</span>
        <input id="f-user" type="text" autocomplete="username" required
               class="mt-1 w-full border border-amber-200 rounded px-3 py-2 text-sm" />
      </label>
      <label class="block">
        <span class="text-sm text-stone-700">密码</span>
        <input id="f-pass" type="password" autocomplete="current-password" required
               class="mt-1 w-full border border-amber-200 rounded px-3 py-2 text-sm" />
      </label>
      <button type="submit" id="btn-login"
              class="w-full bg-amber-600 text-white text-sm py-2 rounded hover:bg-amber-700">登录</button>
      <p id="err" class="text-xs text-red-600 hidden"></p>
    </form>

    <p class="text-[11px] text-stone-400 mt-6">
      数据按账户隔离 · 账户配置在 <code>config/users.json</code>
    </p>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("f-user").value.trim();
      const password = document.getElementById("f-pass").value;
      const err = document.getElementById("err");
      const btn = document.getElementById("btn-login");
      err.classList.add("hidden");
      btn.disabled = true; btn.textContent = "登录中…";
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (!r.ok) {
          let m = "登录失败";
          try { m = (await r.json()).detail || m; } catch {}
          throw new Error(m);
        }
        location.href = "/";
      } catch (ex) {
        err.textContent = ex.message; err.classList.remove("hidden");
        btn.disabled = false; btn.textContent = "登录";
      }
    });
  </script>
</body>
</html>
