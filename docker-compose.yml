services:
  ai-writer:
    image: ghcr.io/sherry56/ai-writer:latest
    container_name: ai-writer
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - /home/project/ai-writer/.env
    volumes:
      - /home/project/ai-writer/data:/app/data
      - /home/project/ai-writer/config:/app/config